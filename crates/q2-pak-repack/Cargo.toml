[package]
name = "q2-pak-repack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Filter a Quake 2 PAK file by extension allowlist, producing a smaller web-optimized PAK"

[[bin]]
name = "q2-pak-repack"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
brotli = "7"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
