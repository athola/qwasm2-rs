name: CI

on:
  push:
    branches: [main, feat/playable-prototype]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Read by the Makefile: fail if Cargo.lock is out of date instead of rewriting it.
  CARGO_FLAGS: --locked

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain, components and wasm32 target pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: make fmt-check
      - run: make lint
      - run: make check
      # The map-data tests (map_load, player_move, PVS, gl3 stock maps) return
      # early without pak0.pak, so fetch the demo pak before running them.
      - name: Read demo pak checksum
        id: demo
        run: echo "sha256=$(sed -n 's/^DEMO_SHA256 *:= *//p' Makefile)" >> "$GITHUB_OUTPUT"
      - name: Restore demo pak0.pak
        id: pak
        uses: actions/cache@v4
        with:
          path: gamedata/baseq2/pak0.pak
          key: q2-demo-pak-${{ steps.demo.outputs.sha256 }}
      - name: Download demo pak0.pak
        if: steps.pak.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          make gamedata-demo
      # Fail loudly rather than let the map-data tests skip as green no-ops.
      - run: test -f gamedata/baseq2/pak0.pak
      - run: make test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # The map-loading spec routes the pak request to the demo pak0.pak.
      - name: Read demo pak checksum
        id: demo
        run: echo "sha256=$(sed -n 's/^DEMO_SHA256 *:= *//p' Makefile)" >> "$GITHUB_OUTPUT"
      - name: Restore demo pak0.pak
        id: pak
        uses: actions/cache@v4
        with:
          path: gamedata/baseq2/pak0.pak
          key: q2-demo-pak-${{ steps.demo.outputs.sha256 }}
      - name: Download demo pak0.pak
        if: steps.pak.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          make gamedata-demo
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/browser/package-lock.json') }}
      # Builds the release wasm bundle (exercising the bundler's glue patching) and runs Playwright.
      - run: make test-browser PLAYWRIGHT_INSTALL_FLAGS=--with-deps
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: tests/browser/test-results
