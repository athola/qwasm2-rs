name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Read by the Makefile: fail if Cargo.lock is out of date instead of rewriting it.
  CARGO_FLAGS: --locked

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain, components and wasm32 target pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: make fmt-check
      - run: make lint
      - run: make check
      # The map-data tests (map_load, player_move, PVS, gl3 stock maps) return
      # early without pak0.pak, so fetch the demo pak before running them.
      - name: Read demo pak checksum
        id: demo
        run: |
          sha=$(sed -n 's/^DEMO_SHA256 *:= *//p' Makefile)
          test -n "$sha"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - name: Restore demo pak0.pak
        id: pak
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gamedata/baseq2/pak0.pak
          key: q2-demo-pak-${{ steps.demo.outputs.sha256 }}
      - name: Download demo pak0.pak
        if: steps.pak.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          make gamedata-demo
      # Fail loudly rather than let the map-data tests skip as green no-ops.
      - run: test -f gamedata/baseq2/pak0.pak
      - run: make test

  # Release builds merge identical function bodies, so a test that only
  # passes in debug can hide a broken savegame callback name registry.
  savegame-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release
      # One codegen unit lets LLVM see, and merge, every identical body;
      # the default 16 hides most pairs and which ones varies by commit.
      - run: cargo test --locked --release -p q2-game savegame
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"

  # Cargo.toml declares rust-version; check the libraries build on it, not
  # only on the newer toolchain rust-toolchain.toml pins.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      - run: cargo +${{ steps.msrv.outputs.version }} check --workspace --locked --lib

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit@0.22.1
      - run: cargo audit

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: wasm-pack@0.15.1
      # The map-loading spec routes the pak request to the demo pak0.pak.
      - name: Read demo pak checksum
        id: demo
        run: |
          sha=$(sed -n 's/^DEMO_SHA256 *:= *//p' Makefile)
          test -n "$sha"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - name: Restore demo pak0.pak
        id: pak
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gamedata/baseq2/pak0.pak
          key: q2-demo-pak-${{ steps.demo.outputs.sha256 }}
      - name: Download demo pak0.pak
        if: steps.pak.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          make gamedata-demo
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/browser/package-lock.json') }}
      # Builds the release wasm bundle (exercising the bundler's glue patching) and runs Playwright.
      - run: make test-browser PLAYWRIGHT_INSTALL_FLAGS=--with-deps
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-test-results
          path: tests/browser/test-results
